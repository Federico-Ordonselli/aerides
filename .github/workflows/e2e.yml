# End-to-end: starts the whole stack with docker compose (nginx, backend, PostgreSQL, Mailpit)
# and runs the Playwright tests in e2e/ against it with a real Chromium.
name: E2E

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Start the stack
        run: |
          # A throw-away secret for this run only
          echo "JWT_SECRET=$(openssl rand -base64 48)" > .env
          docker compose up --detach --build --wait

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Type check
        working-directory: e2e
        run: npm run typecheck

      - name: Run the tests
        working-directory: e2e
        run: npx playwright test

      - name: Backend logs
        if: failure()
        run: docker compose logs backend

      - name: Upload the report (traces and screenshots)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results

# Secret scanning with gitleaks: every push and pull request, for the commits it adds.
# "Run workflow" (workflow_dispatch) scans the whole history. Reviewed false positives are in .gitleaksignore.
# No license key: gitleaks-action needs one only for repositories owned by an organization.
name: Secrets

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # gitleaks reads commits, not only the checked-out files

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Comments on pull requests need pull-requests: write; the job summary and the failed check are enough
          GITLEAKS_ENABLE_COMMENTS: false

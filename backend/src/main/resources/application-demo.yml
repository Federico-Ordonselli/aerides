# Free public demo on Render (see render.yaml): one web service serves the app, the API and the
# WebSocket, emails are only logged. Render provides PORT and RENDER_EXTERNAL_URL at runtime.
# The database comes in DB_URL, DB_USERNAME and DB_PASSWORD as everywhere else (a Neon database, see render.yaml).
server:
  port: ${PORT:8080}

aerides:
  security:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${RENDER_EXTERNAL_URL}}
    # The static page on GitHub Pages that wakes the sleeping instance up (wake-page/)
    status-page-origins: ${STATUS_PAGE_ORIGINS:https://federico-ordonselli.github.io}
  notifications:
    app-url: ${APP_URL:${RENDER_EXTERNAL_URL}}

# Swagger UI is part of the showcase: reviewers can try the API with a demo account's token
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Every value that changes between environments comes from an environment variable.
# Defaults are only provided where they are safe for local development (never for secrets).
spring:
  application:
    name: raidboard
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/raidboard}
    username: ${DB_USERNAME:raidboard}
    password: ${DB_PASSWORD:raidboard}
  jpa:
    # The schema is owned by Flyway; Hibernate only checks that entities match it
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  cache:
    type: caffeine
    cache-names: rawg-search
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m

raidboard:
  security:
    jwt-secret: ${JWT_SECRET}
    issuer: raidboard
    access-token-ttl: ${ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:14d}
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

  rawg:
    base-url: ${RAWG_BASE_URL:https://api.rawg.io/api}
    # Free key from https://rawg.io/apidocs; without it game search answers 503
    api-key: ${RAWG_API_KEY:}
    connect-timeout: 2s
    read-timeout: 5s

  # Brute-force protection for the auth endpoints: "capacity" attempts every "period"
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    login-per-ip-and-email:
      capacity: ${RATE_LIMIT_LOGIN_PER_IP_AND_EMAIL:5}
      period: 1m
    login-per-ip:
      capacity: ${RATE_LIMIT_LOGIN_PER_IP:20}
      period: 1m
    login-per-email:
      capacity: ${RATE_LIMIT_LOGIN_PER_EMAIL:20}
      period: 15m
    refresh-per-ip:
      capacity: ${RATE_LIMIT_REFRESH_PER_IP:20}
      period: 1m

server:
  # Trust X-Forwarded-For from the reverse proxy (nginx, Azure ingress), so the rate limiter
  # sees the real client IP instead of the proxy's. By default Tomcat trusts any proxy on a private
  # network; in production restrict it to the real proxy with SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES.
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

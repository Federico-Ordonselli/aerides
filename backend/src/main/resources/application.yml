# Every value that changes between environments comes from an environment variable.
# Defaults are only provided where they are safe for local development (never for secrets).
spring:
  application:
    name: aerides
  datasource:
    # No defaults: without them the application refuses to start (DatabaseConfigCheck). The localhost
    # defaults for local development are in application-dev.yml.
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      # PostgreSQL gives up waiting for a row lock after this long. A stuck transaction then makes the
      # requests queued behind it fail fast with a "try again" 503, instead of holding their threads forever.
      connection-init-sql: SET lock_timeout = '${DB_LOCK_TIMEOUT:5s}'
  jpa:
    # The schema is owned by Flyway; Hibernate only checks that entities match it
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # One user for both by default. With SPRING_FLYWAY_USER/SPRING_FLYWAY_PASSWORD (the schema owner) the
    # migrations use that user, and DB_USERNAME becomes a rows-only role that Flyway sets up (AppRoleProvisioner)
  data:
    web:
      pageable:
        # Upper bound for ?size=: the calendar asks for a whole month at once, nobody needs more
        max-page-size: 200
  mail:
    # Mailpit in development (web UI on http://localhost:8025)
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  messages:
    # Without this, a locale with no bundle (e.g. "en") would fall back to the server's own locale
    fallback-to-system-locale: false
  thymeleaf:
    # Thymeleaf renders emails only, there are no server-side web pages
    check-template-location: false
  cache:
    type: caffeine
    cache-names: rawg-search
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m

aerides:
  database:
    # Only with a separate Flyway user (AppRoleProvisioner): false sends the application role's password in clear
    # text over TLS, for hosts that refuse pre-hashed passwords (Neon)
    hash-app-password: ${DB_HASH_APP_PASSWORD:true}

  security:
    # Empty when unset, and then the application refuses to start (SecurityConfig): there is no default
    jwt-secret: ${JWT_SECRET:}
    issuer: aerides
    access-token-ttl: ${ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:14d}
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

  rawg:
    base-url: ${RAWG_BASE_URL:https://api.rawg.io/api}
    # Free key from https://rawg.io/apidocs; without it game search answers 503
    api-key: ${RAWG_API_KEY:}
    connect-timeout: 2s
    read-timeout: 5s

  notifications:
    app-url: ${APP_URL:http://localhost:4200}
    mail-from: ${MAIL_FROM:Aerides <noreply@aerides.local>}
    time-zone: ${APP_TIME_ZONE:Europe/Rome}
    reminder-lead-time: 24h
    reminder-interval: ${REMINDER_INTERVAL:5m}
    # A failed email (mail server down) is tried again every retry-interval, up to max-attempts in total
    max-attempts: 3
    retry-interval: 10m

  realtime:
    # How often WebSocket sessions that outlived their access token are closed
    expired-session-sweep-interval: 1m

  discord:
    connect-timeout: 2s
    read-timeout: 5s

  # Brute-force protection for the auth endpoints: "capacity" attempts every "period"
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    login-per-ip-and-email:
      capacity: ${RATE_LIMIT_LOGIN_PER_IP_AND_EMAIL:5}
      period: 1m
    login-per-ip:
      capacity: ${RATE_LIMIT_LOGIN_PER_IP:20}
      period: 1m
    login-per-email:
      capacity: ${RATE_LIMIT_LOGIN_PER_EMAIL:20}
      period: 15m
    refresh-per-ip:
      capacity: ${RATE_LIMIT_REFRESH_PER_IP:20}
      period: 1m

server:
  # Trust X-Forwarded-For from the reverse proxy (nginx, Azure ingress), so the rate limiter
  # sees the real client IP instead of the proxy's. By default Tomcat trusts any proxy on a private
  # network; in production restrict it to the real proxy with SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES.
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

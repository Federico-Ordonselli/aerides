<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Shared layout of every event email. Styles are inline because many email clients ignore <style> blocks.
  th:text escapes HTML, so a user-written event title can't inject markup into the email.
-->
<div th:fragment="email(title, body)"
     style="font-family: Arial, Helvetica, sans-serif; max-width: 560px; margin: 0 auto; color: #1f2933;">
  <h1 style="font-size: 22px; color: #3949ab;" th:text="${title}">Title</h1>
  <p th:text="#{email.greeting(${displayName})}">Hi Giulia,</p>
  <p th:text="${body}">Body</p>
  <table style="border-collapse: collapse; margin: 16px 0;">
    <tr>
      <td colspan="2" style="font-size: 18px; font-weight: bold; padding-bottom: 8px;" th:text="${eventTitle}">
        Raid night
      </td>
    </tr>
    <tr>
      <td style="color: #616e7c; padding-right: 12px;" th:text="#{email.group}">Group</td>
      <td th:text="${groupName}">Gilda dei Draghi</td>
    </tr>
    <tr>
      <td style="color: #616e7c; padding-right: 12px;" th:text="#{email.starts-at}">Starts</td>
      <td th:text="${startsAt}">Friday 30 October 2026, 21:00</td>
    </tr>
  </table>
  <p>
    <a th:href="${eventUrl}" th:text="#{email.open-event}"
       style="display: inline-block; background: #3949ab; color: #ffffff; padding: 10px 18px;
              border-radius: 4px; text-decoration: none;">Open the event</a>
  </p>
  <p style="color: #9aa5b1; font-size: 12px;" th:text="#{email.footer}">Footer</p>
</div>
</body>
</html>

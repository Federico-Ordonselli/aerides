spring:
  datasource:
    hikari:
      # Shorter than in production, so SignupLockTimeoutIT doesn't wait 5 seconds
      connection-init-sql: SET lock_timeout = '2s'

raidboard:
  security:
    jwt-secret: test-secret-for-integration-tests-0123456789
  # Off by default so integration tests can log in freely; RateLimitIT turns it back on
  rate-limit:
    enabled: false
  # Jobs are called directly by the tests that need them, never in the background
  scheduling:
    enabled: false

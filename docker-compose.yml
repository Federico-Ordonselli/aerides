# Starts the whole stack: docker compose up --build
# For day-to-day development start only the infrastructure (docker compose up postgres mailpit)
# and run backend and frontend locally with hot reload (see README).
name: raidboard

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-raidboard}
      POSTGRES_USER: ${POSTGRES_USER:-raidboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-raidboard}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI: http://localhost:8025

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-raidboard}
      DB_USERNAME: ${POSTGRES_USER:-raidboard}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-raidboard}
      DB_LOCK_TIMEOUT: ${DB_LOCK_TIMEOUT:-5s}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required, copy .env.example to .env}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      RAWG_API_KEY: ${RAWG_API_KEY:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_LOGIN_PER_IP_AND_EMAIL: ${RATE_LIMIT_LOGIN_PER_IP_AND_EMAIL:-5}
      RATE_LIMIT_LOGIN_PER_IP: ${RATE_LIMIT_LOGIN_PER_IP:-20}
      RATE_LIMIT_LOGIN_PER_EMAIL: ${RATE_LIMIT_LOGIN_PER_EMAIL:-20}
      RATE_LIMIT_REFRESH_PER_IP: ${RATE_LIMIT_REFRESH_PER_IP:-20}
      # Emails go to Mailpit: open http://localhost:8025 to read them
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      APP_URL: ${APP_URL:-http://localhost:4200}
    ports:
      # Published on localhost only, for Swagger UI (http://localhost:8080/swagger-ui.html).
      # Browsers go through nginx on :4200; the backend must never be publicly reachable directly.
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "4200:80" # app: http://localhost:4200
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:

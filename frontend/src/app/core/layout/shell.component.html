<mat-toolbar class="topbar">
  <a routerLink="/" class="brand">
    <mat-icon aria-hidden="true">event_available</mat-icon>
    Raidboard
  </a>

  <span class="spacer"></span>

  <mat-button-toggle-group
    hideSingleSelectionIndicator
    [value]="languageService.current()"
    (change)="changeLanguage($event.value)"
    [attr.aria-label]="'layout.language' | translate"
  >
    @for (language of languages; track language) {
      <mat-button-toggle [value]="language">{{ language.toUpperCase() }}</mat-button-toggle>
    }
  </mat-button-toggle-group>

  @if (authService.currentUser(); as user) {
    <span class="user-name" data-testid="current-user">{{ user.displayName }}</span>
  }
  <button mat-button (click)="logout()">
    <mat-icon>logout</mat-icon>
    {{ 'auth.logout' | translate }}
  </button>
</mat-toolbar>

<main class="content">
  <router-outlet />
</main>
